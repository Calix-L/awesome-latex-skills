name: Release packaging

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      LATEX_SKILLS_REQUIRE_TEX: '1'
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-bibtex-extra texlive-xetex texlive-luatex biber fonts-noto-cjk
      - run: python scripts/als.py validate
      - run: python scripts/als.py evaluate validate
      - run: python scripts/check_sources_ci.py --output work/source-audit.json
      - run: python -m unittest discover -s tests -v
      - run: python scripts/als.py examples run --output work/example-run
      - run: python scripts/als.py paper --output work/full-paper-run --language zh
      - run: python -m pip install build
      - run: python -m build --outdir dist/package
      - run: python scripts/check_packages.py --directory dist/package --output work/package-verification
      - run: python scripts/als.py release --output dist/release --distribution-dir dist/package
      - uses: actions/upload-artifact@v7
        with:
          name: release-archives
          path: dist/release
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-example-evidence
          path: work/example-run
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-full-paper-evidence
          path: work/full-paper-run
          include-hidden-files: true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-package-evidence
          path: |
            work/package-verification/verification.json
            work/package-verification/wheel/verification.json
            work/package-verification/sdist/verification.json
            work/package-verification/rebuilt/*.whl
