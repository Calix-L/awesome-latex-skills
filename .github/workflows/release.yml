name: Release packaging

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      LATEX_SKILLS_REQUIRE_TEX: '1'
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-bibtex-extra texlive-xetex texlive-luatex biber
      - run: python scripts/als.py validate
      - run: python scripts/als.py evaluate validate
      - run: python scripts/als.py sources --validate-only
      - run: python -m unittest discover -s tests -v
      - run: python scripts/als.py examples run --output work/example-run
      - run: python scripts/als.py release --output dist/release
      - uses: actions/upload-artifact@v7
        with:
          name: release-archives
          path: dist/release
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-example-evidence
          path: work/example-run
